<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDR LIBRARY FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a192f;color:#fff}
.h{background:#162447;padding:12px;text-align:center;border-bottom:2px solid #d4af37}
.h h1{margin:0;color:#d4af37;font-size:20px}
.card{background:#162447;margin:12px;padding:14px;border-radius:10px;border:1px solid #23395d}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #23395d;background:#0a192f;color:#fff}
button{padding:10px 14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-gold{background:#d4af37;color:#0a192f;width:100%;margin-top:8px}
.btn-green{background:#16a34a;color:#fff;width:100%;margin-top:8px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seat{padding:10px;text-align:center;border-radius:6px;font-weight:bold;font-size:12px}
.empty{background:#1e293b;color:#94a3b8;border:1px dashed #334155}
.occ{background:#d4af37;color:#0a192f}
.row{display:flex;gap:6px}
</style></head><body>
<div class="h"><h1>SDR LIBRARY</h1><small>Ghosi - Helpline 7986649280</small></div>

<div class="card">
<h3 style="margin:0 0 8px;color:#d4af37">Student Login</h3>
<input id="sm" placeholder="Mobile 10 digit" maxlength="10" inputmode="numeric">
<div class="row"><input id="sp" type="password" placeholder="Password"><button onclick="toggle('sp')">👁️</button></div>
<button class="btn-gold" onclick="studentLogin()">LOGIN AS STUDENT</button>
<p id="smsg"></p>
<div id="sinfo"></div>
</div>

<div class="card">
<h3 style="margin:0 0 8px;color:#d4af37">Admin Access</h3>
<div class="row"><input id="ap" type="password" placeholder="Enter Admin PIN"><button onclick="toggle('ap')">👁️</button></div>
<button class="btn-gold" onclick="adminLogin()">ENTER</button>
<p id="amsg"></p>
</div>

<div class="card" id="adminPanel" style="display:none">
<h3 style="color:#d4af37;margin:0">32 Seats - <span id="occCount">0 Occupied</span></h3>
<div class="seats" id="seatGrid"></div>
<button class="btn-gold" onclick="openAdd()">+ Add Student</button>
<div id="list"></div>
</div>

<div class="card" id="addModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000c;z-index:10;overflow:auto">
<div style="background:#162447;margin:20px;padding:14px;border-radius:10px">
<h3 id="mTitle" style="color:#d4af37">Add Student</h3>
<input id="nm" placeholder="Name">
<input id="mob" placeholder="Mobile 10 digit" maxlength="10" inputmode="numeric">
<div class="row"><input id="pwd" type="password" placeholder="Password"><button onclick="toggle('pwd')">👁️</button></div>
<select id="seatSel"></select>
<input id="course" placeholder="Course">
<input id="father" placeholder="Father Name">
<input id="addr" placeholder="Address">
<p style="color:#d4af37;font-weight:bold">Fees 2026 Jan-Dec</p>
<div id="feesBox" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px"></div>
<div class="row"><button onclick="closeAdd()" style="background:#334155;color:#fff;width:100%">Cancel</button>
<button class="btn-green" onclick="saveStudent()">SAVE BOTH DETAILS + FEES</button></div>
<p id="saveMsg"></p>
</div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('sdr_v6')||'[]');
let editId=null;
const SEATS=[];
for(let g of ['A','B','C','D']) for(let i=1;i<=8;i++) SEATS.push(g+i);
function toggle(id){let e=document.getElementById(id);e.type=e.type==='password'?'text':'password'}
function save(){localStorage.setItem('sdr_v6',JSON.stringify(students)); render();}
function render(){
 let grid=document.getElementById('seatGrid'); grid.innerHTML='';
 let occ=0;
 SEATS.forEach(s=>{
  let st=students.find(x=>x.seat===s);
  let d=document.createElement('div');
  d.className='seat '+(st?'occ':'empty');
  d.textContent=st? s+' '+st.name[0]: s;
  d.onclick=()=>{ if(st) alert(st.name+' - '+st.mobile+' - Seat '+s); };
  grid.appendChild(d);
  if(st) occ++;
 });
 document.getElementById('occCount').textContent=occ+' Occupied / '+(32-occ)+' Empty';
 let list=document.getElementById('list'); list.innerHTML='<hr>';
 students.forEach(st=>{
  let div=document.createElement('div'); div.style.cssText='background:#0a192f;padding:8px;margin:6px 0;border-radius:6px;display:flex;justify-content:space-between';
  div.innerHTML=`<span>${st.name} - ${st.mobile} - ${st.seat} ${st.fees.filter(Boolean).length>0?'🟢':'🔴'}</span><span><button onclick="editStu(${st.id})">Edit</button> <button onclick="delStu(${st.id})">Del</button></span>`;
  list.appendChild(div);
 });
}
function openAdd(){
 editId=null;
 document.getElementById('mTitle').textContent='Add Student';
 ['nm','mob','pwd','course','father','addr'].forEach(id=>document.getElementById(id).value='');
 buildSeatSel(null); buildFees(new Array(12).fill(false));
 document.getElementById('addModal').style.display='block';
}
function closeAdd(){document.getElementById('addModal').style.display='none';}
function buildSeatSel(cur){
 let sel=document.getElementById('seatSel'); sel.innerHTML='<option value="">Select Seat</option>';
 SEATS.forEach(s=>{
  let occ=students.find(x=>x.seat===s);
  let dis = occ && (!cur || occ.seat!==cur);
  sel.innerHTML+=`<option value="${s}" ${dis?'disabled':''}>${s} ${dis?' - Occupied by '+occ.name:''}</option>`;
 });
 if(cur) sel.value=cur;
}
function buildFees(arr){
 let box=document.getElementById('feesBox'); box.innerHTML='';
 let months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 months.forEach((m,i)=>{
  box.innerHTML+=`<label style="font-size:12px"><input type="checkbox" ${arr[i]?'checked':''} id="f${i}"> ${m}</label>`;
 });
}
function saveStudent(){
 let name=document.getElementById('nm').value.trim();
 let mob=document.getElementById('mob').value.trim();
 let pwd=document.getElementById('pwd').value.trim();
 let seat=document.getElementById('seatSel').value;
 let course=document.getElementById('course').value.trim();
 if(!name||!mob||!pwd||!seat){document.getElementById('saveMsg').textContent='Name, Mobile, Password, Seat required';return;}
 if(!/^[0-9]{10}$/.test(mob)){document.getElementById('saveMsg').textContent='Mobile must be 10 digit';return;}
 let dup=students.find(x=>x.mobile===mob && x.id!==editId);
 if(dup){document.getElementById('saveMsg').textContent='Mobile already exists';return;}
 let seatOcc=students.find(x=>x.seat===seat && x.id!==editId);
 if(seatOcc){document.getElementById('saveMsg').textContent='Seat '+seat+' already occupied by '+seatOcc.name;return;}
 let fees=[]; for(let i=0;i<12;i++) fees.push(document.getElementById('f'+i).checked);
 if(editId){
  let idx=students.findIndex(x=>x.id===editId);
  students[idx]={...students[idx],name,mobile:mob,password:pwd,seat,course,father:document.getElementById('father').value,address:document.getElementById('addr').value,fees};
 }else{
  students.push({id:Date.now(),name,mobile:mob,password:pwd,seat,course,father:document.getElementById('father').value,address:document.getElementById('addr').value,fees,admissionDate:new Date().toISOString()});
 }
 save(); closeAdd(); document.getElementById('saveMsg').textContent='';
 alert('Saved - Seat '+seat+' assigned');
}
function editStu(id){
 let st=students.find(x=>x.id===id); if(!st) return;
 editId=id;
 document.getElementById('mTitle').textContent='Edit Student';
 document.getElementById('nm').value=st.name; document.getElementById('mob').value=st.mobile; document.getElementById('pwd').value=st.password;
 document.getElementById('course').value=st.course||''; document.getElementById('father').value=st.father||''; document.getElementById('addr').value=st.address||'';
 buildSeatSel(st.seat); buildFees(st.fees||new Array(12).fill(false));
 document.getElementById('addModal').style.display='block';
}
function delStu(id){ if(!confirm('Delete?')) return; students=students.filter(x=>x.id!==id); save(); }
function adminLogin(){
 let pin=document.getElementById('ap').value.trim();
 if(pin==='7985'){ document.getElementById('adminPanel').style.display='block'; document.getElementById('amsg').textContent='Admin OK'; render(); }
 else document.getElementById('amsg').textContent='Wrong PIN';
}
function studentLogin(){
 let m=document.getElementById('sm').value.trim();
 let p=document.getElementById('sp').value.trim();
 let st=students.find(x=>x.mobile===m && x.password===p);
 if(!st){document.getElementById('smsg').textContent='Invalid mobile or password';return;}
 document.getElementById('smsg').textContent='Welcome '+st.name;
 let paid=st.fees?st.fees.filter(Boolean).length:0;
 document.getElementById('sinfo').innerHTML=`<div style="background:#0a192f;padding:8px;border-radius:6px;margin-top:8px">Seat: ${st.seat} | Course: ${st.course||'-'} | Fees Paid: ${paid}/12 ${paid===12?'🟢':'🔴'} | Father: ${st.father||'-'}</div>`;
}
render();
</script>
</body></html>
