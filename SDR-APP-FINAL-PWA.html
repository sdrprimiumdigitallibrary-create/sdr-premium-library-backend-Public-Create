function getDaily(bankName){
  const bank=BANKS[bankName]||[];
  const d=new Date(); const seed=d.getDate()+d.getMonth()*31+d.getFullYear()*373;
  const start=seed % bank.length; const out=[];
  for(let i=0;i<10;i++) out.push(bank[(start+i)%bank.length]);
  return out;
}
