<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDR PREMIUM FINAL</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#0a192f;color:white" class="p-2">
<div id="app"></div>
<script>
const COURSES=["10th","12th","UPTET","SUPER TET","CTET","UPSC","SSC CGL","Railway","Banking","UP Police","Lekhpal","NDA","CDS","CUET","NEET","JEE"];
const DEFAULT=[
{sNo:1,name:"Demo UP Police",seat:"A1",phone:"9876543210",course:"UP Police",fees:{Jan:"Paid"},paid:1000},
{sNo:2,name:"Test Lekhpal",seat:"A2",phone:"9876543211",course:"Lekhpal",fees:{},paid:0},
{sNo:3,name:"Suraj 10th",seat:"B1",phone:"9876543212",course:"10th",fees:{},paid:0}
];
let students=JSON.parse(localStorage.getItem('sdr_v15')||'null')||DEFAULT;
function save(){localStorage.setItem('sdr_v15',JSON.stringify(students));}
let view="landing",current=null,tab="course",logoC=0,editS=null;
const BANKS={
"Current":Array.from({length:30},(_,i)=>({q:`Current Q${i+1} - ISRO/Budget 2025`,o:["A","B","C","D"],c:0})),
"GK":Array.from({length:30},(_,i)=>({q:[`UP me 75 jile`,`Rajdhani Lucknow`,`Pashu Barasingha`,`Pakshi Sarus`,`First CM GB Pant`][i%5],o:["75","Lucknow","Barasingha","Sarus","GB Pant"],c:0})),
"GS":Array.from({length:20},(_,i)=>({q:`GS ${i+1}`,o:["A","B","C","D"],c:0})),
"UP Police":Array.from({length:20},(_,i)=>({q:`UP Police Q${i+1}`,o:["A","B","C","D"],c:0})),
"Lekhpal":Array.from({length:20},(_,i)=>({q:`Lekhpal Q${i+1}`,o:["A","B","C","D"],c:0})),
"10th":Array.from({length:20},(_,i)=>({q:`10th Q${i+1}`,o:["A","B","C","D"],c:0}))
};
function daily(n){let b=BANKS[n]||BANKS["Current"];let d=new Date();let s=d.getDate();return b.slice(s%15,s%15+10);}
function render(){
let r=document.getElementById('app');
if(view=="landing"){
r.innerHTML=`<div class="max-w-md mx-auto pt-10 text-center"><img id="logo" src="https://i.ibb.co/9mYvF0Lz/IMG-20250820-WA0002.jpg" class="w-20 h-20 mx-auto rounded-full border-2 border-yellow-500 bg-black object-cover"><h1 class="text-2xl font-bold text-yellow-400 mt-2">SDR PREMIUM</h1><p class="text-xs text-gray-400">MUHAMMADPUR HASANPUR</p><div class="bg-white/5 border border-yellow-500/20 rounded-2xl p-6 mt-6 text-left"><h2 class="font-bold mb-3">Student Login - Demo: A1,A2,B1</h2><input id="seat" placeholder="Seat A1 ya ADMIN" class="w-full p-3 rounded-xl bg-black/50 border border-white/10 mb-3"><button onclick="doLogin()" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Login</button><p class="text-[10px] text-gray-500 mt-2">Admin: logo pe 5x tap</p></div></div>`;
document.getElementById('logo').onclick=()=>{logoC++;setTimeout(()=>logoC=0,3000);if(logoC>=5){view="aLogin";render();}};
document.getElementById('seat').oninput=(e)=>{if(e.target.value.toUpperCase()=="ADMIN"){view="aLogin";render();}};
}
else if(view=="aLogin"){
r.innerHTML=`<div class="max-w-md mx-auto pt-20"><h2 class="font-bold mb-4">Admin PIN 7985</h2><input id="pin" type="password" class="w-full p-3 rounded-xl bg-black/50 border border-white/10 mb-3"><button onclick="if(document.getElementById('pin').value=='7985'){view='aDash';render();}else alert('Wrong')" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">Login</button><button onclick="view='landing';render()" class="mt-3 text-gray-400 w-full">Back</button></div>`;
}
else if(view=="aDash"){
r.innerHTML=`<div><div class="flex justify-between mb-4"><h2 class="font-bold">Admin - Edit Working ✅</h2><button onclick="view='landing';render()" class="bg-red-500/20 px-4 py-1 rounded">Exit</button></div>
<div class="grid grid-cols-8 gap-1 my-4">${Array.from({length:40},(_,i)=>{let s=String.fromCharCode(65+Math.floor(i/8))+(i%8+1);let st=students.find(x=>x.seat==s);return `<div class="p-1 text-[10px] rounded text-center ${st?'bg-green-500/20':'bg-white/5'}">${s}</div>`}).join('')}</div>
<div class="space-y-2">${students.map(s=>`<div class="bg-white/5 p-3 rounded flex justify-between"><div><b>${s.seat}</b> ${s.name} (${s.course})</div><div class="flex gap-1"><button onclick="editStudent(${s.sNo})" class="bg-yellow-500 text-black px-3 py-1 rounded text-xs font-bold">EDIT</button><button onclick="delStudent(${s.sNo})" class="bg-red-500/20 text-red-300 px-2 py-1 rounded text-xs">Del</button></div></div>`).join('')}</div>
<button onclick="addStudent()" class="mt-4 w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">+ Add Student</button>
${editS?`<div class="fixed inset-0 bg-black/90 p-4"><div class="bg-[#112240] p-6 rounded-2xl max-w-md mx-auto mt-10"><h3 class="font-bold mb-3">Edit ${editS.seat} - Working</h3><input id="eName" value="${editS.name}" class="w-full p-3 rounded bg-black/50 border border-white/10 mb-2" placeholder="Name"><input id="eSeat" value="${editS.seat}" class="w-full p-3 rounded bg-black/50 border border-white/10 mb-2" placeholder="Seat"><input id="ePhone" value="${editS.phone}" class="w-full p-3 rounded bg-black/50 border border-white/10 mb-2" placeholder="Phone"><select id="eCourse" class="w-full p-3 rounded bg-black/50 border border-white/10 mb-3">${COURSES.map(c=>`<option ${editS.course==c?'selected':''}>${c}</option>`).join('')}</select><button onclick="saveEdit()" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">SAVE & SYNC</button><button onclick="editS=null;render()" class="w-full mt-2 bg-white/10 p-2 rounded">Cancel</button></div></div>`:''}
</div>`;
}
else if(view=="sDash"){
let qs=daily(tab=="course"?current.course: tab=="current"?"Current": tab=="gk"?"GK":"GS");
r.innerHTML=`<div class="max-w-2xl mx-auto"><h2 class="font-bold text-yellow-400">${current.name} - ${current.course}</h2><p class="text-[10px] text-green-400">● Auto Updated Daily 6 AM</p>
<div class="flex gap-2 my-3 overflow-x-auto"><button onclick="tab='course';render()" class="px-3 py-1 rounded-full text-xs ${tab=='course'?'bg-yellow-500 text-black':'bg-white/10'}">Your: ${current.course}</button><button onclick="tab='current';render()" class="px-3 py-1 rounded-full text-xs ${tab=='current'?'bg-yellow-500 text-black':'bg-white/10'}">Current</button><button onclick="tab='gk';render()" class="px-3 py-1 rounded-full text-xs ${tab=='gk'?'bg-yellow-500 text-black':'bg-white/10'}">GK UP</button><button onclick="tab='gs';render()" class="px-3 py-1 rounded-full text-xs ${tab=='gs'?'bg-yellow-500 text-black':'bg-white/10'}">GS</button></div>
<div class="space-y-3">${qs.map((q,i)=>`<div class="bg-white/5 p-3 rounded-xl"><p class="text-sm font-bold">${i+1}. ${q.q}</p>${q.o.map(o=>`<div class="text-xs mt-1">• ${o}</div>`).join('')}</div>`).join('')}</div>
<button onclick="view='landing';render()" class="mt-4 bg-white/10 px-4 py-2 rounded">Logout</button></div>`;
}
}
function doLogin(){let v=document.getElementById('seat').value.trim().toUpperCase();if(v=="ADMIN"){view="aLogin";render();return;}let f=students.find(s=>s.seat.toUpperCase()==v);if(!f){alert("Seat not found! Try A1, A2, B1");return;}current=f;view="sDash";tab="course";render();}
function editStudent(sNo){editS=students.find(s=>s.sNo==sNo);render();}
function saveEdit(){editS.name=document.getElementById('eName').value;editS.seat=document.getElementById('eSeat').value.toUpperCase();editS.phone=document.getElementById('ePhone').value;editS.course=document.getElementById('eCourse').value;save();editS=null;render();alert("Saved! Student panel me sync ho gaya ✅");}
function delStudent(sNo){if(confirm("Delete?")){students=students.filter(s=>s.sNo!=sNo);save();render();}}
function addStudent(){let seat=prompt("Seat? C1");if(!seat)return;let name=prompt("Name?");if(!name)return;students.push({sNo:Date.now(),name,seat:seat.toUpperCase(),phone:"",course:"UP Police",fees:{},paid:0});save();render();}
document.addEventListener('visibilitychange',()=>{if(document.hidden && view=="aDash"){view="landing";render();}});
render();
</script>
</body></html>
